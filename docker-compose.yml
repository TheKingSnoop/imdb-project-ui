services:
  frontend-dev:
    build:
      context: .
      target: development
    container_name: imdb-frontend-dev
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_HOST=localhost:3001
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true
    networks:
      - imdb-network

  frontend-prod:
    build:
      context: .
      target: production
    container_name: imdb-frontend-prod
    ports:
      - "8080:80"
    networks:
      - imdb-network
    profiles:
      - production

networks:
  imdb-network:
    driver: bridge
